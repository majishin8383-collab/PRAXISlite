<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Praxis Lite</title>
  <meta name="description" content="Praxis Lite — a self-guided emotional regulation tool (Stabilize → Stop the Urge → Move Forward → Emergency)." />

  <!-- GitHub Pages base-path safe -->
  <base href="./" />

  <!-- PWA -->
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#0b0f14">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Icons -->
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <!-- Styles -->
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/components.css">
  <link rel="stylesheet" href="./styles/home.css">
  <link rel="stylesheet" href="./styles/flows.css">
  <link rel="stylesheet" href="./styles/redzone.css">
  <link rel="stylesheet" href="./styles/lite-mobile.css">
</head>

<body>
  <div id="app" class="app">
    <header class="appHeader">
      <div class="brand">
        <div class="brandTitle">PRAXIS LITE</div>
        <div class="brandSub">Stabilize → Stop the Urge → Move Forward</div>
      </div>
      <nav class="topNav">
        <button class="linkBtn" id="navHome" type="button" aria-label="Reset to Home">Reset</button>
      </nav>
    </header>

    <main id="main" class="main" role="main">
      <section class="card">
        <h2 class="h2">Loading…</h2>
        <p class="muted">If this stays, Lite JS is not loading.</p>
        <p class="muted" style="opacity:.7;">build lite-pwa-1</p>
      </section>
    </main>

    <footer class="footer">
      <div>
        <strong>© 2026 Joseph Satmary.</strong> All rights reserved.
        <span class="beta">Lite — focused, minimal, and intentionally simple.</span>
      </div>
      <div>
        <a href="./legal.html">Legal</a>
      </div>
    </footer>
  </div>

  <!-- On-page error capture -->
  <script>
    (function () {
      const m = () => document.getElementById("main");
      function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
      function show(msg){
        const el = m(); if(!el) return;
        el.innerHTML = `<section class="card">
          <h2 class="h2">Lite failed to load</h2>
          <p class="muted" style="white-space:pre-wrap;">${esc(msg)}</p>
          <p class="muted" style="opacity:.7;">build lite-pwa-1</p>
        </section>`;
      }
      window.addEventListener("error", (e) => show(e?.message || e?.error || "Unknown error"));
      window.addEventListener("unhandledrejection", (e) => show(e?.reason || "Unhandled rejection"));
    })();
  </script>

  <!-- Register service worker (PWA) -->
  <script>
    (function () {
      if (!("serviceWorker" in navigator)) return;

      window.addEventListener("load", async () => {
        try {
          const reg = await navigator.serviceWorker.register("./sw.js", { scope: "./" });

          // Ask the browser to check for an updated sw.js (helps on GitHub Pages caching)
          try { await reg.update(); } catch {}

          // If a new SW is waiting, activate it ASAP and refresh once.
          if (reg.waiting) {
            reg.waiting.postMessage({ type: "SKIP_WAITING" });
          }

          reg.addEventListener("updatefound", () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener("statechange", () => {
              if (sw.state === "installed" && navigator.serviceWorker.controller) {
                // New version installed; reload once to ensure fresh JS/modules.
                location.reload();
              }
            });
          });
        } catch {}
      });
    })();
  </script>

  <!-- Praxis Lite boot (deterministic cache-buster) -->
  <script type="module" src="./js/lite/app.js?v=lite-pwa-1"></script>
</body>
</html>
